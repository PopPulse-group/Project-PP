# 复制本文件为 etc/poppulse.yaml 后按需修改本地值；本文件提交仓库，poppulse.yaml 不提交
Name: poppulse-api
Host: 0.0.0.0
Port: 8888
Mode: dev
Timeout: 5000

Mysql:
  # docker compose up 后默认端口 3306，密码见 deployments/docker-compose.yml
  DataSource: "root:poppulse123@tcp(127.0.0.1:3306)/poppulse?charset=utf8mb4&parseTime=true&loc=Local"

Auth:
  AccessSecret: "poppulse-dev-secret-change-me-in-prod"
  AccessExpire: 86400

PayTimeoutMinutes: 15

# 模拟能力：模拟支付/退款仅在本开关开启时可用；生产环境必须为 false
Mock:
  Enabled: true
